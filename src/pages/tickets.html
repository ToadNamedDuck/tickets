<div class="tickets-page">

    <h1>View Active and Resolved Tickets</h1>

    <button routerLink="/newTicket" class="new-ticket-link">Submit New Ticket</button>

    <h2>Active Tickets</h2>
    <hr/>
    <div class="active-tickets">
        <app-ticket-list [tickets]="tickets" selection="Open"></app-ticket-list>
    </div>

    <h2>Closed Tickets</h2>
    <hr/>
    <div class="closed-tickets">
        <app-ticket-list [tickets]="tickets" selection="Closed"></app-ticket-list>
    </div>
</div>
